<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SKYDROP ROYALE</title>
    <style>
      html, body {
        background: #02120a;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      #game {
        outline: none;
        width: 100%;
        height: 100%;
        display: block;
        position: fixed;
        inset: 0;
      }
      #ui {
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
        position: fixed;
        inset: 0;
      }
      #boot {
        color: #fff;
        z-index: 100;
        letter-spacing: 0.08em;
        background: radial-gradient(at 50% 30%, #0e8a5a 0%, #0c3a2a 45%, #02120a 100%);
        place-items: center;
        font: 700 22px system-ui, sans-serif;
        display: grid;
        position: fixed;
        inset: 0;
      }
      #boot .bt {
        flex-direction: column;
        align-items: center;
        animation: 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both bt-in;
        display: flex;
        transform: rotate(-3deg);
      }
      #boot b {
        letter-spacing: 0.03em;
        color: #fff;
        text-shadow: 0 4px #02120a, 3px 0 #02120a, -3px 0 #02120a, 0 -3px #02120a, 0 10px 24px #0006, 0 0 32px #ffc62e88;
        font: 400 clamp(40px, 9vw, 96px)/0.9 Impact, Arial Black, sans-serif;
      }
      #boot i {
        letter-spacing: 0.08em;
        color: #02120a;
        background: linear-gradient(90deg, #32ffa8, #0e8a5a 55%, #ffc62e);
        margin-top: 6px;
        padding: 2px 18px;
        font: 400 clamp(22px, 4.6vw, 48px)/1.1 Impact, Arial Black, sans-serif;
        transform: skew(-12deg);
        box-shadow: 0 4px #0b1630;
      }
      #boot span {
        background: #050c228c;
        border-radius: 4px;
        width: clamp(160px, 26vw, 300px);
        height: 8px;
        margin-top: 28px;
        position: relative;
        overflow: hidden;
        transform: rotate(3deg);
      }
      #boot span:after {
        content: "";
        background: linear-gradient(90deg, #32ffa8, #ffc62e);
        border-radius: 4px;
        width: 40%;
        animation: 1.1s ease-in-out infinite bt-bar;
        position: absolute;
        top: 0;
        bottom: 0;
      }
      @keyframes bt-in {
        0% {
          opacity: 0;
          transform: rotate(-3deg) scale(0.7);
        }
      }
      @keyframes bt-bar {
        0% { left: -40%; }
        to { left: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bt, #boot span:after { animation: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="ui"></div>
    <div id="boot" aria-label="Loading">
      <div class="bt"><b>SKYDROP</b><i>ROYALE</i><span></span></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
